# UPower Configuration for Critical Battery Hibernation
# This file should be copied to /etc/UPower/UPower.conf
# After copying, enable and start upower.service:
#   sudo systemctl enable --now upower.service

[UPower]

# Use percentage for policy (true) or time-based (false)
# When true, the Percentage* options below will be used
UsePercentageForPolicy=true

# The percentage level at which the battery is considered "Low"
# Default: 10
PercentageLow=10

# The percentage level at which the battery is considered "Critical"
# Default: 3
PercentageCritical=5

# The percentage level at which the critical action is taken
# Default: 2
PercentageAction=3

# The action to take when the battery reaches the critical level
# Possible values:
#   PowerOff    - Shut down the system
#   Hibernate   - Hibernate to disk (requires swap >= RAM)
#   HybridSleep - Suspend to RAM and disk simultaneously
#
# If HybridSleep isn't available, Hibernate will be used
# If Hibernate isn't available, PowerOff will be used
#
# Default: HybridSleep
# Recommended for hibernation setup: Hibernate
CriticalPowerAction=Hibernate

# Time-based policy settings (only used if UsePercentageForPolicy=false)
# These are defaults and typically not used with percentage-based policy
TimeLow=1200        # 20 minutes remaining
TimeCritical=300    # 5 minutes remaining
TimeAction=120      # 2 minutes remaining

# Ignore device power state when calculating percentage
# Default: false
IgnoreInhibitors=false

# Suppress low battery warnings
# Default: false
SuppressLowBatteryWarning=false

# Additional notes for this configuration:
#
# 1. This configuration works alongside the battery monitor script
#    - Battery monitor: Warning at 10%, Hibernate at 5%
#    - UPower daemon: Hibernate at 3% (failsafe backup)
#
# 2. UPower runs as a system service and monitors battery events
#    - It's more reliable than user-space scripts
#    - Works even if user session is not active
#    - Provides system-wide critical battery protection
#
# 3. For UPower to work properly:
#    - upower.service must be enabled and running
#    - Hibernate must be properly configured (swap file + GRUB params)
#    - Test hibernation manually before relying on it
#
# 4. To verify UPower is working:
#    - Check status: systemctl status upower.service
#    - Monitor events: journalctl -u upower.service -f
#    - Test battery info: upower -i $(upower -e | grep BAT)
#
# 5. If you want to use UPower exclusively (instead of the battery monitor script):
#    - Set PercentageAction=5 instead of 3
#    - The system will hibernate at 5% via UPower daemon
#    - You can disable the user-space battery monitor if desired
